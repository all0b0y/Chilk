name: Chilk
options:
  bundleIdPrefix: dev.all0b0y
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: ru
  createIntermediateGroups: true
packages:
  ChilkKit:
    path: ChilkKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Chilk:
    type: application
    platform: macOS
    sources:
      - path: Chilk
    dependencies:
      - package: ChilkKit
        product: ChilkCore
      - package: ChilkKit
        product: ChilkRender
      - package: ChilkKit
        product: ChilkBrain
      - package: ChilkKit
        product: ChilkEars
      - package: ChilkKit
        product: ChilkApple
    info:
      path: Chilk/Resources/Info.plist
      properties:
        CFBundleName: Chilk
        CFBundleDisplayName: Чилк
        CFBundleDevelopmentRegion: ru
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        LSMinimumSystemVersion: "26.0"
        NSPrincipalClass: NSApplication
        # Slice 5a: lives in the menu-bar tray, never in the Dock (no icon flash at launch).
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 all0b0y"
        NSMicrophoneUsageDescription: "С включёнными ушами Чилк слушает локально, чтобы услышать своё имя. Уши можно выключить в трее наверху → «Инструменты»; горячая клавиша включает микрофон только на время разговора."
        NSSpeechRecognitionUsageDescription: "Чилк распознаёт речь прямо на этом Mac, чтобы понять твою просьбу."
        NSRemindersFullAccessUsageDescription: "Чилк ставит напоминания, о которых ты просишь, в отдельный список «Чилк» и читает только его."
        NSRemindersUsageDescription: "Чилк ставит напоминания, о которых ты просишь, в отдельный список «Чилк» и читает только его."
        NSCalendarsFullAccessUsageDescription: "Чилк записывает события, о которых ты просишь, в отдельный календарь «Чилк» и читает только его."
        NSCalendarsUsageDescription: "Чилк записывает события, о которых ты просишь, в отдельный календарь «Чилк» и читает только его."
        NSAppleEventsUsageDescription: "Чилк записывает заметки, о которых ты просишь, в отдельную папку «Чилк» в «Заметках» и читает только её."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.all0b0y.chilk
        PRODUCT_NAME: Chilk
        CODE_SIGN_STYLE: Manual
        # Stable signature (own Apple Development certificate): macOS keeps the microphone permission across rebuilds.
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: complete
