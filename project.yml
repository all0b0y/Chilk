name: Chilk
options:
  bundleIdPrefix: dev.all0b0y
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: ru
  createIntermediateGroups: true
packages:
  ChilkKit:
    path: ChilkKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Chilk:
    type: application
    platform: macOS
    sources:
      - path: Chilk
    dependencies:
      - package: ChilkKit
        product: ChilkCore
      - package: ChilkKit
        product: ChilkRender
    info:
      path: Chilk/Resources/Info.plist
      properties:
        CFBundleName: Chilk
        CFBundleDisplayName: Чилк
        CFBundleDevelopmentRegion: ru
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        LSMinimumSystemVersion: "26.0"
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© 2026 all0b0y"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.all0b0y.chilk
        PRODUCT_NAME: Chilk
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: complete
